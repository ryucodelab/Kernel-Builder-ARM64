name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source (git URL)"
        required: true
        type: string
      KERNEL_BRANCH:
        description: "Kernel branch"
        required: true
        type: string
      KERNEL_DEFCONFIG:
        description: "Kernel defconfig (contoh: vendor/xxx_defconfig)"
        required: true
        type: string
      ANYKERNEL3:
        description: "Repo AnyKernel3 (git URL)"
        required: true
        type: string
        default: "https://github.com/osm0sis/AnyKernel3"
      LOCALVERSION:
        description: "Custom Localversion (contoh: -MyKernel)"
        required: false
        type: string
        default: "-CustomKernel"
      WORKSPACE_NAME:
        description: "Workspace name"
        required: true
        type: string
        default: "kernel-workspace"
      DEVICE_CODENAME:
        description: "Device codename (contoh: violet)"
        required: true
        type: string
      KERNEL_NAME:
        description: "Kernel Name (contoh: Stormbreaker)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Telegram - Build Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="🔨 *Kernel Build Started*

          *Kernel Name:* \`${{ inputs.KERNEL_NAME }}\`
          *Device:* \`${{ inputs.DEVICE_CODENAME }}\`
          *Branch:* \`${{ inputs.KERNEL_BRANCH }}\`
          *Defconfig:* \`${{ inputs.KERNEL_DEFCONFIG }}\`
          *Localversion:* \`${{ inputs.LOCALVERSION }}\`
          *Triggered by:* \`${{ github.actor }}\`" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"📄 Cek Log\",\"url\":\"${RUN_URL}\"}]]}"

      - name: Setup swap space (biar aman dari OOM saat kompilasi)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.KERNEL_SOURCE }}" "${{ inputs.WORKSPACE_NAME }}"

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 "${{ inputs.ANYKERNEL3 }}" AnyKernel3

      - name: Customize anykernel.sh
        run: |
          cd AnyKernel3
          if [ -f anykernel.sh ]; then
            # Ganti kernel.string kalau baris-nya ada
            sed -i "s/kernel\.string=.*/kernel.string=${{ inputs.KERNEL_NAME }} for ${{ inputs.DEVICE_CODENAME }}/" anykernel.sh
            # Ganti device.name0 (device codename utama), sisanya (name1, name2, dst) dibiarin apa adanya
            sed -i "s/device\.name0=.*/device.name0=${{ inputs.DEVICE_CODENAME }}/" anykernel.sh
            echo "✅ anykernel.sh berhasil dicustom."
          else
            echo "⚠️ anykernel.sh tidak ditemukan, skip customize."
          fi

      - name: Setup Proton Clang (kompatibel penuh sama Ubuntu 22.04, jarang error)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Export environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Builder" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHubActions" >> $GITHUB_ENV

      - name: Generate defconfig
        working-directory: ${{ inputs.WORKSPACE_NAME }}
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 ${{ inputs.KERNEL_DEFCONFIG }}

      - name: Build kernel
        working-directory: ${{ inputs.WORKSPACE_NAME }}
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export LOCALVERSION="${{ inputs.LOCALVERSION }}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Cek & deteksi otomatis hasil build
        working-directory: ${{ inputs.WORKSPACE_NAME }}
        run: |
          BOOT_DIR="out/arch/arm64/boot"
          # Urutan prioritas: paling lengkap (udah include dtb) ke paling basic
          CANDIDATES="Image.gz-dtb Image-dtb Image.gz Image"
          FOUND=""
          for f in $CANDIDATES; do
            if [ -f "$BOOT_DIR/$f" ]; then
              FOUND="$f"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "❌ Build gagal, tidak ada file Image (Image/Image.gz/Image-dtb/Image.gz-dtb) yang ditemukan. Cek build.log."
            exit 1
          fi

          echo "✅ Build sukses! Output terdeteksi: $FOUND"
          echo "KERNEL_IMAGE=$FOUND" >> $GITHUB_ENV

      - name: Package dengan AnyKernel3
        run: |
          cd "${{ inputs.WORKSPACE_NAME }}/out/arch/arm64/boot"
          # Cuma copy image yang beneran kedetect, bukan asal Image*
          cp "$KERNEL_IMAGE" "$GITHUB_WORKSPACE/AnyKernel3/Image" 2>/dev/null || true
          [ -f dtbo.img ] && cp dtbo.img "$GITHUB_WORKSPACE/AnyKernel3/" || true
          [ -f dtb.img ] && cp dtb.img "$GITHUB_WORKSPACE/AnyKernel3/" || true
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          KNAME=$(echo "${{ inputs.KERNEL_NAME }}" | tr ' ' '-')
          CODENAME=$(echo "${{ inputs.DEVICE_CODENAME }}" | tr ' ' '-')
          ZIP_NAME="${KNAME}-${CODENAME}-$(date +%Y%m%d).zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md "*.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.WORKSPACE_NAME }}-kernel
          path: AnyKernel3/${{ env.ZIP_NAME }}

      - name: Upload build log (buat debug kalau error)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ inputs.WORKSPACE_NAME }}/build.log

      - name: Notify Telegram - Build Success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="✅ *Build Berhasil!*

          *Kernel Name:* \`${{ inputs.KERNEL_NAME }}\`
          *Device:* \`${{ inputs.DEVICE_CODENAME }}\`
          *File:* \`${{ env.ZIP_NAME }}\`
          *Triggered by:* \`${{ github.actor }}\`

          Zip sudah tersedia di Artifacts run ini." \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"📄 Cek Log\",\"url\":\"${RUN_URL}\"},{\"text\":\"⬇️ Download Artifact\",\"url\":\"${RUN_URL}\"}]]}"

      - name: Notify Telegram - Build Failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *Build Gagal!*

          *Kernel Name:* \`${{ inputs.KERNEL_NAME }}\`
          *Device:* \`${{ inputs.DEVICE_CODENAME }}\`
          *Branch:* \`${{ inputs.KERNEL_BRANCH }}\`
          *Defconfig:* \`${{ inputs.KERNEL_DEFCONFIG }}\`
          *Triggered by:* \`${{ github.actor }}\`

          Cek log buat lihat error-nya." \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"📄 Cek Log Error\",\"url\":\"${RUN_URL}\"}]]}"
